# STTmini 发布流水线（AGENTS.md §10.4）。
# 仅在 GitHub Release 发布时触发（不在普通 push/tag 时跑）。
name: release

on:
  release:
    types: [published]

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      # 第三方 action 一律 pin 到完整 SHA（AGENTS.md §10.4），浮动 tag 会被更新。
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      # 版本号取自 release tag（如 v0.1.0 → 0.1.0）
      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: 发布（调用 scripts/publish.sh，本地与 CI 一致）
        shell: bash
        run: |
          bash scripts/publish.sh "${{ steps.ver.outputs.version }}" "${{ matrix.rid }}"

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            dist/STTmini-${{ matrix.rid }}-*

      - name: 上传构建产物（artifact，便于调试）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: STTmini-${{ matrix.rid }}-dist
          path: dist/
          if-no-files-found: warn
